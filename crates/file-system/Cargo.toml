[package]
name = "file-system"
version = "0.1.0"
description = "The one seam every filesystem operation goes through: the real filesystem, paths as given; or the same std::fs re-rooted under a directory (a temporary one, in tests)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
angzarr-diagnostic.workspace = true
# The host's syscalls (modes, links, file identity, directory sync) and a
# path's top: what differs between operating systems lives there.
os.workspace = true
# write_atomic's staged file, make_temp_dir, and Rooted::temp: a re-rooted
# filesystem that owns (and removes) its root.
tempfile.workspace = true

[dev-dependencies]
# Rendering catalogs' English (`english_for!`), for the tests that hold it
# to Go's, and reading the catalog's messages and variables.
angzarr-presentation = { workspace = true, features = ["test-support"] }
fluent-syntax.workspace = true
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }

# The build writes the catalog's source under the crate's name
# (angzarr_diagnostic::build): no catalog spells its crate's name.
[build-dependencies]
angzarr-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
